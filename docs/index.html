
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone AI Sensor Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #1f2937;
            padding: 25px;
            border-radius: 15px;
        }

        select, button {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:disabled {
            background: #4b5563;
            cursor: not-allowed;
        }

        #stopButton {
            background: #dc2626;
        }

        #status {
            margin-top: 20px;
            color: #93c5fd;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>iPhone AI Sensor Lab</h1>
    <p>Real-time sensor data collection</p>

    <label for="activity">Select activity</label>

    <select id="activity">
        <option value="stationary">Stationary</option>
        <option value="walking">Walking</option>
        <option value="running">Running</option>
    </select>

    <button id="startButton">Start Recording</button>

    <button id="stopButton" disabled>Stop Recording</button>

    <button id="downloadButton" disabled>Download CSV</button>

    <h3 id="status">Ready</h3>

    <p id="sampleCount">Samples: 0</p>

</div>

<script>

let samples = [];
let recording = false;
let startTime = 0;
let recordingId = "";
let selectedActivity = "";

const activitySelect = document.getElementById("activity");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const downloadButton = document.getElementById("downloadButton");
const statusText = document.getElementById("status");
const sampleCount = document.getElementById("sampleCount");


function handleMotion(event) {

    if (!recording) return;

    const acceleration = event.accelerationIncludingGravity;
    const rotation = event.rotationRate;

    if (!acceleration) return;

    const timestamp = (performance.now() - startTime) / 1000;

    const sample = {
        timestamp: timestamp.toFixed(3),

        acc_x: acceleration.x,
        acc_y: acceleration.y,
        acc_z: acceleration.z,

        gyro_alpha: rotation ? rotation.alpha : null,
        gyro_beta: rotation ? rotation.beta : null,
        gyro_gamma: rotation ? rotation.gamma : null,

        activity: selectedActivity,
        recording_id: recordingId
    };

    samples.push(sample);

    sampleCount.textContent = "Samples: " + samples.length;
}


async function startRecording() {

    if (!window.DeviceMotionEvent) {
        statusText.textContent = "DeviceMotion not supported";
        return;
    }

    try {

        // iOS Safari may require permission.
        if (typeof DeviceMotionEvent.requestPermission === "function") {

            const permission = await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {
                statusText.textContent = "Sensor permission denied";
                return;
            }
        }

        samples = [];

        selectedActivity = activitySelect.value;

        recordingId =
            selectedActivity + "_" +
            new Date().toISOString().replace(/[:.]/g, "-");

        startTime = performance.now();

        recording = true;

        window.addEventListener("devicemotion", handleMotion);

        startButton.disabled = true;
        stopButton.disabled = false;
        downloadButton.disabled = true;
        activitySelect.disabled = true;

        statusText.textContent = "Recording: " + selectedActivity;

    } catch (error) {

        statusText.textContent = "Error: " + error.message;

    }
}


function stopRecording() {

    if (!recording) return;

    recording = false;

    window.removeEventListener("devicemotion", handleMotion);

    startButton.disabled = false;
    stopButton.disabled = true;
    activitySelect.disabled = false;

    downloadButton.disabled = samples.length === 0;

    statusText.textContent =
        "Recording stopped: " + samples.length + " samples";

}


function downloadCSV() {

    if (samples.length === 0) return;

    const headers = [
        "timestamp",
        "acc_x",
        "acc_y",
        "acc_z",
        "gyro_alpha",
        "gyro_beta",
        "gyro_gamma",
        "activity",
        "recording_id"
    ];

    const rows = samples.map(sample =>
        headers.map(header => sample[header] ?? "").join(",")
    );

    const csv = [
        headers.join(","),
        ...rows
    ].join("\n");

    const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = recordingId + ".csv";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}


startButton.addEventListener("click", startRecording);
stopButton.addEventListener("click", stopRecording);
downloadButton.addEventListener("click", downloadCSV);

</script>

</body>
</html>
