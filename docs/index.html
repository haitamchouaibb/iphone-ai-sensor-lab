
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone AI Sensor Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            padding: 25px;
            text-align: center;
        }

        h1 { color: #60a5fa; }

        .sensor {
            background: #1f2937;
            padding: 15px;
            margin: 12px auto;
            border-radius: 12px;
            max-width: 400px;
        }

        .value {
            font-size: 20px;
            color: #34d399;
        }

        button {
            padding: 14px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #start { background: #2563eb; color: white; }
        #stop { background: #dc2626; color: white; }
        #download { background: #059669; color: white; }
    </style>
</head>

<body>

    <h1>iPhone AI Sensor Lab</h1>
    <p>Real-time sensor acquisition</p>

    <div class="sensor">
        <h3>Accelerometer (m/s²)</h3>
        <p class="value" id="accX">X: --</p>
        <p class="value" id="accY">Y: --</p>
        <p class="value" id="accZ">Z: --</p>
    </div>

    <div class="sensor">
        <h3>Gyroscope (deg/s)</h3>
        <p class="value" id="gyroX">X: --</p>
        <p class="value" id="gyroY">Y: --</p>
        <p class="value" id="gyroZ">Z: --</p>
    </div>

    <p id="status">Waiting for sensor permission...</p>
    <p id="counter">Samples: 0</p>

    <button id="start">Start recording</button>
    <button id="stop">Stop recording</button>
    <button id="download">Download CSV</button>

<script>

let samples = [];
let recording = false;
let startTime = null;

const status = document.getElementById("status");

function handleMotion(event) {

    const acceleration = event.accelerationIncludingGravity;
    const rotation = event.rotationRate;

    if (!acceleration) return;

    const timestamp = (performance.now() - startTime) / 1000;

    const sample = {
        timestamp: timestamp,
        acc_x: acceleration.x,
        acc_y: acceleration.y,
        acc_z: acceleration.z,
        gyro_alpha: rotation?.alpha ?? null,
        gyro_beta: rotation?.beta ?? null,
        gyro_gamma: rotation?.gamma ?? null
    };

    if (recording) {
        samples.push(sample);
        document.getElementById("counter").textContent =
            "Samples: " + samples.length;
    }

    document.getElementById("accX").textContent =
        "X: " + sample.acc_x?.toFixed(3);

    document.getElementById("accY").textContent =
        "Y: " + sample.acc_y?.toFixed(3);

    document.getElementById("accZ").textContent =
        "Z: " + sample.acc_z?.toFixed(3);

    document.getElementById("gyroX").textContent =
        "Alpha: " + sample.gyro_alpha;

    document.getElementById("gyroY").textContent =
        "Beta: " + sample.gyro_beta;

    document.getElementById("gyroZ").textContent =
        "Gamma: " + sample.gyro_gamma;
}

document.getElementById("start").onclick = async () => {

    if (recording) return;

    if (typeof DeviceMotionEvent === "undefined") {
        status.textContent = "Motion sensors not supported.";
        return;
    }

    if (typeof DeviceMotionEvent.requestPermission === "function") {

        try {
            const permission =
                await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {
                status.textContent = "Permission denied.";
                return;
            }

        } catch (error) {
            status.textContent = error.message;
            return;
        }
    }

    samples = [];
    startTime = performance.now();
    recording = true;

    window.addEventListener("devicemotion", handleMotion);

    status.textContent = "Recording...";
};

document.getElementById("stop").onclick = () => {

    if (!recording) return;

    recording = false;

    window.removeEventListener("devicemotion", handleMotion);

    status.textContent = "Recording stopped.";
};

document.getElementById("download").onclick = () => {

    if (samples.length === 0) {
        status.textContent = "No data available.";
        return;
    }

    const headers = Object.keys(samples[0]);

    const rows = samples.map(sample =>
        headers.map(header => sample[header] ?? "").join(",")
    );

    const csv = [
        headers.join(","),
        ...rows
    ].join("\n");

    const blob = new Blob([csv], { type: "text/csv" });

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "iphone_sensor_data.csv";

    link.click();

    URL.revokeObjectURL(url);
};

</script>

</body>
</html>
